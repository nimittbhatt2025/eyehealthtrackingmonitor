name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + migrations)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eyevio
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eyevio_test_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eyevio_test_db
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eyevio_migrations
      PGPASSWORD: postgres
      WARM_MODELS: '0'
      MPLCONFIGDIR: /tmp/mpl
      FLASK_APP: run.py
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: eyevio/requirements.txt

      - name: System libraries for OpenCV / MediaPipe
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install dependencies
        # CPU wheels only; the default torch wheel pulls ~2 GB of CUDA libraries.
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt pytest

      - name: Migrations apply to an empty database and roll back
        run: |
          createdb -h localhost -U postgres eyevio_migrations
          flask db upgrade
          flask db downgrade base
          flask db upgrade

      - name: pytest
        # Gitignored weights are absent here; tests that need them skip.
        run: python -m pytest tests/ -q -rs

  frontend:
    name: Frontend (lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eyevio-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: eyevio-frontend/package-lock.json

      - run: npm ci

      - name: Lint (errors fail; warning count may only go down)
        run: npm run lint:ci

      - name: Stimulus goldens, scoring and retrieval tests
        run: npm test

      - name: Upload golden-image diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diffs
          path: eyevio-frontend/tests/golden/__diff__/
          if-no-files-found: ignore

      - name: On-device preprocessing parity with the server pipeline
        # Model-output checks skip themselves when onnx_models/ is absent (gitignored).
        run: npm run test:parity

      - name: Build
        run: npm run build
